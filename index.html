<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Trinity Preços</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1, h2, h3 {
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      background: #fff;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #efefef;
    }
    .note {
      font-size: 14px;
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Calculadora Trinity Preços</h1>
      <div class="grid">
        <div>
          <label for="distancia">Distância de ida (km)</label>
          <input type="text" id="distancia" placeholder="Ex.: 120,5" />
        </div>
        <div>
          <label for="tempo">Tempo de ida (h)</label>
          <input type="text" id="tempo" placeholder="Ex.: 2,5" />
        </div>
      </div>
      <div style="margin-top:16px;">
        <button id="calcularBtn">Calcular</button>
      </div>
    </div>

    <div class="card hidden" id="resumoCard">
      <h2>Resumo</h2>
      <div id="resumo"></div>
    </div>

    <div class="card hidden" id="resultadosCard">
      <h2>Resultados</h2>
      <div id="tabelas"></div>
      <div class="note">* aplicado valor mínimo</div>
    </div>
  </div>

  <script>
    // JavaScript entra aqui
  </script>
</body>
</html>
